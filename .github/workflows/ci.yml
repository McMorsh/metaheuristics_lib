name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,plot]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .
      - run: pytest -q
      - run: pytest -q --cov=src/metaheuristics_lib/core --cov=src/metaheuristics_lib/utils --cov-report=term-missing --cov-fail-under=80
      - run: pytest -q --cov=src/metaheuristics_lib/algorithms --cov=src/metaheuristics_lib/problems --cov-report=term-missing --cov-fail-under=70
      - run: pytest -q -m integration

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install build
      - run: python -m build
      - run: python -m venv /tmp/wheel-venv
      - run: /tmp/wheel-venv/bin/pip install --upgrade pip
      - run: /tmp/wheel-venv/bin/pip install dist/*.whl
      - run: /tmp/wheel-venv/bin/python -c "import importlib.util, metaheuristics_lib; from metaheuristics_lib import algorithms, core, problems, utils; assert importlib.util.find_spec('core') is None; print(metaheuristics_lib.__file__)"
        working-directory: /tmp

  mpi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update
      - run: sudo apt-get install -y openmpi-bin libopenmpi-dev
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,plot,mpi]"
      - run: pytest -q -m integration
