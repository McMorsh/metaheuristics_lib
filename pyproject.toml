[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "metaheuristics-lib"
version = "0.3.0"
description = "Учебная библиотека метаэвристических алгоритмов"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=2.1"]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.9",
    "mypy>=1.13",
    "matplotlib>=3.9",
]
plot = ["matplotlib>=3.9"]
mpi = ["mpi4py>=4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["metaheuristics_lib*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в тексте - норма проекта

[tool.ruff.lint.isort]
known-first-party = ["metaheuristics_lib"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
exclude = [
    "^\\.venv/",
    "^build/",
    "^dist/",
    ".*\\.egg-info/",
]

[[tool.mypy.overrides]]
module = ["matplotlib.*", "mpi4py.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["integration: тесты с MPI или несколькими процессами"]
addopts = "-ra -m 'not integration'"

[tool.coverage.run]
branch = true
source = ["src/metaheuristics_lib"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
